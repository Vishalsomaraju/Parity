# Parity — Production Render Deployment Blueprint
# Supports full multi-service deployment with resilient survival mode
services:
  # 1. API Web Service
  - type: web
    name: parity-api
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:backend
    startCommand: npm --workspace=backend run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SIMILARITY_THRESHOLD
        value: "0.65"
      - key: DATABASE_URL
        fromDatabase:
          name: parity-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: parity-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # 2. Frontend Static Site
  - type: web
    name: parity-frontend
    env: static
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: parity-api
          property: url

  # 3. Background Worker (Optional in degraded survival mode)
  - type: worker
    name: parity-worker
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:backend
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: parity-db
          property: connectionString

# Infrastructure Databases
databases:
  - name: parity-db
    plan: starter
    databaseName: parity
    user: parity_user
    postgresMajorVersion: 16

# Redis Cache
services:
  - type: redis
    name: parity-redis
    plan: starter
    ipAllowList: [] # internal access only
